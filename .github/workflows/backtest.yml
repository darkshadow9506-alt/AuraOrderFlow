name: AuraOrderFlow Backtest

# Runs the strategy over real historical Binance futures order flow
# (data.binance.vision) and prints a win-rate / expectancy / profit-factor
# report to the job log. No secrets needed — public data only.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols"
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      days:
        description: "Number of days to test"
        default: "5"
      end:
        description: "Last day YYYY-MM-DD (blank = yesterday)"
        default: ""
      min_confidence:
        description: "Min confidence override (blank = config)"
        default: ""
      rr:
        description: "Risk:reward override (blank = config)"
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          ARGS="--symbols '${{ inputs.symbols }}' --days ${{ inputs.days }}"
          if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          if [ -n "${{ inputs.min_confidence }}" ]; then ARGS="$ARGS --min-confidence ${{ inputs.min_confidence }}"; fi
          if [ -n "${{ inputs.rr }}" ]; then ARGS="$ARGS --rr ${{ inputs.rr }}"; fi
          echo "Running: python -m auraorderflow.backtest $ARGS"
          eval python -m auraorderflow.backtest $ARGS

# AuraOrderFlow configuration
# ---------------------------------------------------------------------------
# Secrets (Telegram token / chat id) live in environment variables / .env,
# NEVER in this file. See .env.example.

bar_period_seconds: 60     # footprint bar length
profile_window: 240        # bars used to build the volume profile (~4h of 1m)
history_window: 300        # bars kept in memory per symbol

strategy:
  min_confidence: 72        # 0-100; higher = fewer, higher-quality signals
  min_confirmations: 3      # how many order-flow patterns must agree
  require_level: true       # only fire at structural levels (rule #1)
  level_tolerance_pct: 0.0012   # how close to a level counts as "at" it (0.12%)
  confidence_scale: 2.6     # confluence-score -> confidence calibration
  risk_reward: 2.0          # suggested target = risk_reward * stop distance
  imbalance_ratio: 3.0      # footprint imbalance threshold (3:1)
  signal_cooldown_seconds: 1200  # min gap between same symbol+side alerts

  # --- multi-timeframe layer ---
  htf_lookback_minutes: 60     # higher-timeframe trend window (1m bars => ~1h)
  require_htf_alignment: true  # continuation trades must match the HTF trend
  use_vwap: true               # session VWAP as a structural level
  use_prev_day_levels: true    # previous-day high/low as structural levels

# Markets with REAL, free, real-time order flow (Binance USD-M Futures).
# These are the deep, liquid markets where order flow is actually tradeable;
# illiquid alts have noisy, unreliable footprints, so they are deliberately
# excluded. `price_step` is the footprint bucket size in quote currency.
symbols:
  - symbol: BTCUSDT
    price_step: 5
  - symbol: ETHUSDT
    price_step: 0.5
  - symbol: SOLUSDT
    price_step: 0.05
  - symbol: BNBUSDT
    price_step: 0.1
  - symbol: XRPUSDT
    price_step: 0.0005
  - symbol: DOGEUSDT
    price_step: 0.00005
  - symbol: AVAXUSDT
    price_step: 0.01
  - symbol: LINKUSDT
    price_step: 0.01
  - symbol: PAXGUSDT        # PAX Gold — tokenized physical gold => real flow
    price_step: 0.5
    alias: GOLD

# Markets the user asked about whose genuine order-flow data is paywalled.
# Listed so the bot can report them honestly (see /symbols). To enable, add a
# licensed adapter (see auraorderflow/data/base.py).
unsupported:
  - symbol: NQ
    reason: "CME futures — needs a licensed feed (Databento / Rithmic / CQG)"
  - symbol: ES
    reason: "CME futures — needs a licensed feed (Databento / Rithmic / CQG)"
